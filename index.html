<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem("theme");
          const supportDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && supportDark)) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="color-scheme"]').content = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.querySelector('meta[name="color-scheme"]').content = "light";
          }
        } catch (_) {}
      })();
    </script>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Alex Lin | 个人作品集与能力展台</title>
    <meta name="description" content="Alex Lin - AI 原生工程能力与商务日语应用作品集展台（公开脱敏展示版）" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡️</text></svg>" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  </head>

  </body>
</html>
